[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "yt-intel"
version = "0.1.0"
description = "Local YouTube Video Intelligence MCP server"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anyio>=4,<5",
    "google-auth[requests]>=2,<3",
    "google-auth-oauthlib>=1,<2",
    "httpx>=0.28,<1",
    "keyring>=25,<26; sys_platform == 'win32'",
    "mcp==2.3.0",
    "mcp-types==2.3.0",
    "platformdirs>=4,<5",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    # Keep the SDK's native Windows dependency conditional in pip-compile output.
    "pywin32>=311; sys_platform == 'win32'",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
yt-intel = "yt_intel.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1,<2",
    "editables>=0.5,<1",
    "hatchling==1.33.0",
    "hypothesis>=6,<7",
    "mypy>=1,<3",
    "pip==24.3.1",
    "pip-tools==7.5.2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "pyyaml>=6,<7",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: separately authorized tests against the official YouTube API"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "keyring"
# The locked keyring dependency is Windows-only.
ignore_missing_imports = true
